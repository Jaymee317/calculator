<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport", content="device-width", initial scale = 1.0>
    <title>My calculator</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <div id="calcBody">
        <label id="resultLabel">0</label>
        <div id="btnContainer">


            <button id="leftBracket" class="num" value=(>&lpar;</button>
            <button id="rightBracket" class="num" value=)>&rpar;</button>
            <button id="percent" class="operator" value=%>%</button>
            <button id="ac">AC</button>
            <br>
            <button id="seven" class="num" value=7>7</button>
            <button id="eight" class="num" value=8>8</button>
            <button id="nine" class="num" value=9>9</button>
            <button id="divide" class="operator" value="/">/</button>
            <br>
            <button id="four" class="num" value=4>4</button>
            <button id="five" class="num" value=5>5</button>
            <button id="six" class="num" value=6>6</button>
            <button id="multiply" class="operator" value="*">*</button>
            <br>
            <button id="one" class="num" value=1>1</button>
            <button id="two" class="num" value=2>2</button>
            <button id="three" class="num" value=3>3</button>
            <button id="minus" class="operator" value="-">-</button>
            <br>
            <button id="zero" class="num" value=0>0</button>
            <button id="dot" class="num" value=.>.</button>
            <button id="equal">=</button>
            <button id="add" class="operator" value="+">+</button>
        </div>
    </div>
    <script src = "index.js"></script>
</body>
</html>
